AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFront with S3 Origin Group, OAC and Route 53 Routing (Sandbox Friendly)'

Parameters:
  MyDomainName:
    Type: String
    Default: 'mun-aws-projekti.testi'
    Description: 'Syötä testidomain (esim. oma-nimi.testi). Huom: example.com on estetty.'

Resources:
  # Tämä luo "${MyDomainName}" -ympäristön AWS:n sisälle, vaikkei domainia oikeasti omistettaisi.
  MyHostedZone:
    Type: 'AWS::Route53::HostedZone'
    Properties:
      Name: !Ref '${MyDomainName}'

  CloudFrontOriginAccessControl:
    Type: 'AWS::CloudFront::OriginAccessControl'
    Properties:
      OriginAccessControlConfig:
        Description: 'Access Control for S3 Buckets'
        Name: !Sub '${AWS::StackName}-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: 'AWS::CloudFront::Distribution'
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html

        # Sandboxissa käytetään oletussertifikaattia, koska meillä ei ole ACM-sertifikaattia
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

        Origins:
          - Id: PrimaryS3
            DomainName: !Sub 'website-us-east-1-${AWS::AccountId}.s3.us-east-1.amazonaws.com'
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id

          - Id: SecondaryS3
            DomainName: !Sub 'website-us-west-2-${AWS::AccountId}.s3.us-west-2.amazonaws.com'
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id

        OriginGroups:
          Quantity: 1
          Items:
            - Id: MyOriginGroup
              FailoverCriteria:
                StatusCodes:
                  Quantity: 4
                  Items: [403, 404, 500, 502]
              Members:
                Quantity: 2
                Items:
                  - OriginId: PrimaryS3
                  - OriginId: SecondaryS3

        DefaultCacheBehavior:
          TargetOriginId: MyOriginGroup
          ViewerProtocolPolicy: allow-all # Sandbox-testauksessa helpompi kuin redirect
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]

  # Route 53 -rekisteri, joka ohjaa "www.example.com" -nimen CloudFrontiin
  MyDNSWebRecord:
    Type: 'AWS::Route53::RecordSet'
    Properties:
      HostedZoneId: !Ref MyHostedZone
      Name: !Sub 'www.${MyDomainName}.'
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName

Outputs:
  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: 'CloudFrontin osoite, vaikka ei olisi route53'
  Route53Record:
    Value: !Sub 'www.${MyDomainName}.'
    Description: 'Tämä nimi ohjaa nyt CloudFrontiin AWS-ympäristössäsi'
